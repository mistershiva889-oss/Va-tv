<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111114">
  <title>VA TV - Video Search</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #101012;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #19191e;
      padding: 20px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #29292e;
    }

    .logo {
      color: #ff343d;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      width: 100%;
      min-width: 0;
      padding: 15px;
      border: 1px solid #34343b;
      border-radius: 13px;
      background: #29292f;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ff343d;
    }

    button {
      padding: 0 20px;
      border: none;
      border-radius: 12px;
      background: #ff343d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 18px 14px 40px;
    }

    #status {
      color: #c2c2c8;
      text-align: center;
      padding: 22px 8px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .feed {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }

    .card {
      overflow: hidden;
      border: 1px solid #303036;
      border-radius: 15px;
      background: #1a1a1f;
      animation: appear .35s ease;
    }

    .player {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      background: #000;
    }

    .info {
      padding: 14px;
    }

    .title {
      font-size: 17px;
      line-height: 1.5;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .channel {
      color: #aaaab3;
      margin-top: 8px;
      font-size: 14px;
    }

    .more {
      display: block;
      margin: 24px auto 0;
      padding: 14px 22px;
      min-height: 46px;
    }

    .hidden {
      display: none;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 700px) {
      .feed {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .logo {
        max-width: 900px;
        margin: 0 auto 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">▶ VA TV</div>

    <form class="search-box" id="searchForm">
      <input
        id="query"
        type="search"
        placeholder="वीडियो खोजें..."
        aria-label="वीडियो खोजें"
        required
      >
      <button id="searchButton" type="submit">Search</button>
    </form>
  </header>

  <main>
    <div id="status" role="status">
      वीडियो खोजने के लिए ऊपर नाम लिखें।
    </div>

    <section class="feed" id="feed"></section>

    <button id="moreButton" class="more hidden" type="button">
      और वीडियो देखें
    </button>
  </main>

  <script>
    // अपनी नई YouTube Data API v3 Key यहाँ डालें।
    const API_KEY = "YOUR_NEW_API_KEY";

    const form = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const searchButton = document.getElementById("searchButton");
    const moreButton = document.getElementById("moreButton");
    const feed = document.getElementById("feed");
    const statusBox = document.getElementById("status");

    let nextPageToken = "";
    let currentQuery = "";
    let isLoading = false;

    function setStatus(message) {
      statusBox.textContent = message;
      statusBox.classList.remove("hidden");
    }

    function makeVideoCard(video) {
      const id = video.id.videoId;
      const title = video.snippet.title;
      const channel = video.snippet.channelTitle;

      const card = document.createElement("article");
      card.className = "card";

      const player = document.createElement("iframe");
      player.className = "player";
      player.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id);

      player.title = title;
      player.loading = "lazy";
      player.allow =
        "accelerometer; autoplay; clipboard-write; " +
        "encrypted-media; gyroscope; picture-in-picture; web-share";
      player.allowFullscreen = true;
      player.referrerPolicy = "strict-origin-when-cross-origin";

      const info = document.createElement("div");
      info.className = "info";

      const titleElement = document.createElement("div");
      titleElement.className = "title";
      titleElement.textContent = title;

      const channelElement = document.createElement("div");
      channelElement.className = "channel";
      channelElement.textContent = channel;

      info.append(titleElement, channelElement);
      card.append(player, info);

      return card;
    }

    async function searchVideos(loadMore = false) {
      if (isLoading) return;

      if (!API_KEY || API_KEY === "YOUR_NEW_API_KEY") {
        setStatus(
          "API Key सेट नहीं है। कोड में अपनी नई YouTube API Key डालें।"
        );
        return;
      }

      const query = queryInput.value.trim();

      if (!query) {
        setStatus("पहले वीडियो का नाम लिखें।");
        queryInput.focus();
        return;
      }

      if (!loadMore) {
        currentQuery = query;
        nextPageToken = "";
        feed.replaceChildren();
        moreButton.classList.add("hidden");
      }

      isLoading = true;
      searchButton.disabled = true;
      moreButton.disabled = true;
      setStatus("वीडियो खोजे जा रहे हैं...");

      try {
        const params = new URLSearchParams({
          part: "snippet",
          type: "video",
          maxResults: "10",
          q: currentQuery,
          key: API_KEY
        });

        if (loadMore && nextPageToken) {
          params.set("pageToken", nextPageToken);
        }

        const response = await fetch(
          "https://www.googleapis.com/youtube/v3/search?" +
          params.toString()
        );

        const data = await response.json();

        if (!response.ok) {
          const message =
            data.error?.message || "API अनुरोध असफल हुआ।";
          throw new Error(message);
        }

        const videos = (data.items || []).filter(
          item => item.id && item.id.videoId && item.snippet
        );

        nextPageToken = data.nextPageToken || "";

        if (!videos.length && !loadMore) {
          setStatus("कोई वीडियो नहीं मिला। दूसरा नाम खोजें।");
          return;
        }

        videos.forEach(video => {
          feed.appendChild(makeVideoCard(video));
        });

        if (feed.children.length > 0) {
          statusBox.classList.add("hidden");
        }

        moreButton.classList.toggle(
          "hidden",
          !nextPageToken
        );

        if (!videos.length && loadMore) {
          setStatus("अभी और वीडियो नहीं मिले।");
        }

      } catch (error) {
        setStatus(
          "त्रुटि: " + error.message +
          " — API चालू है और Key सही है, यह जाँचें।"
        );
      } finally {
        isLoading = false;
        searchButton.disabled = false;
        moreButton.disabled = false;
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      searchVideos(false);
    });

    moreButton.addEventListener("click", () => {
      if (nextPageToken) searchVideos(true);
    });
  </script>

</body>
</html>
