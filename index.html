
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VA TV - Video Feed</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d0f;color:white;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#17171b;padding:15px;z-index:5}
h2{margin:0 0 12px;color:#ff3434}
.search{display:flex;gap:8px}
input{width:100%;padding:12px;border:0;border-radius:9px;background:#292930;color:white}
button{border:0;border-radius:9px;padding:12px;background:#ff3434;color:white;font-weight:bold}
main{max-width:700px;margin:auto;padding:12px}
.card{background:#1b1b20;border-radius:14px;overflow:hidden;margin-bottom:18px}
.card iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.info{padding:12px}
.title{font-size:16px;font-weight:bold}
.channel{color:#aaa;font-size:13px;margin-top:8px}
.status{color:#bbb;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
  <h2>▶ VA TV</h2>
  <div class="search">
    <input id="query" placeholder="वीडियो खोजें...">
    <button onclick="searchVideos()">Search</button>
  </div>
</header>
<main>
  <div id="status" class="status">अपनी API Key जोड़कर वीडियो खोजें।</div>
  <div id="feed"></div>
</main>

<script>
const API_KEY = "";
const feed = document.getElementById("feed");
const statusBox = document.getElementById("status");

async function searchVideos(){
  const q = document.getElementById("query").value.trim();
  if(!q){
    statusBox.textContent = "पहले वीडियो का नाम लिखें।";
    return;
  }
  if(!API_KEY){
    statusBox.textContent = "API Key अभी सेट नहीं है। पहले सुरक्षित तरीके से API जोड़ें।";
    return;
  }

  statusBox.textContent = "वीडियो खोजे जा रहे हैं...";
  feed.innerHTML = "";

  try{
    const url = new URL("https://www.googleapis.com/youtube/v3/search");
    url.search = new URLSearchParams({
      part:"snippet",
      type:"video",
      maxResults:"15",
      q:q,
      key:API_KEY
    });

    const response = await fetch(url);
    const data = await response.json();

    if(!response.ok) throw new Error(data.error?.message || "API अनुरोध असफल हुआ।");

    if(!data.items?.length){
      statusBox.textContent = "कोई वीडियो नहीं मिला।";
      return;
    }

    statusBox.textContent = "";

    data.items.forEach(item=>{
      const id = item.id.videoId;
      const title = item.snippet.title;
      const channel = item.snippet.channelTitle;

      const card = document.createElement("article");
      card.className = "card";

      const player = document.createElement("iframe");
      player.src = "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id);
      player.title = title;
      player.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      player.allowFullscreen = true;

      const info = document.createElement("div");
      info.className = "info";

      const titleEl = document.createElement("div");
      titleEl.className = "title";
      titleEl.textContent = title;

      const channelEl = document.createElement("div");
      channelEl.className = "channel";
      channelEl.textContent = channel;

      info.append(titleEl, channelEl);
      card.append(player, info);
      feed.appendChild(card);
    });
  }catch(error){
    statusBox.textContent = "त्रुटि: " + error.message;
  }
}

document.getElementById("query").addEventListener("keydown", e=>{
  if(e.key === "Enter") searchVideos();
});
</script>
</body>
</html>
